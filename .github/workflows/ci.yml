name: ci
on:
  # Pull requests run the tests; pushes to main only when code changes. Bot commits of the archive,
  # reports, research notes and snapshot do not re-run the suite (it saves about half the Actions minutes,
  # spent instead on more desk and refresh runs).
  push:
    branches: [main]
    paths-ignore: ["archive/**", "docs/**", "snapshot/**", "README.md"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MACRO_MODE: demo
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint
        run: make lint
      - name: Type check (lenient)
        run: make typecheck
      - name: Tests (demo data, live tests skipped)
        run: make test
