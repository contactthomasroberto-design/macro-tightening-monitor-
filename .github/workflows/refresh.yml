name: refresh
# Daily live refresh (weekdays): data, models, forecast archive, README summary and figures; the
# weekly monitor on Mondays, the monthly view in the first week. A push to main also makes Streamlit
# Community Cloud redeploy, so the online dashboard starts from the new numbers.
# Secrets: FRED_API_KEY (optional; enables ALFRED vintages). Never echoed.
on:
  schedule:
    - cron: "17 14 * * 1-5"   # weekdays 14:17 UTC: after Asian, European and 8:30 ET US releases
  workflow_dispatch:
  push:  # after a code change, rebuild the warm-start snapshot with the new code
    branches: [main]
    paths: ["src/**", "app/**", "config/**", "requirements.txt"]
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MACRO_MODE: live
      PYTHONHASHSEED: "0"
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Live smoke test (non-blocking; report uploaded)
        continue-on-error: true
        run: python -m pytest -m live -q -p no:cacheprovider tests/test_live_smoke.py
      - name: Update data
        run: |
          if [ -n "$FRED_API_KEY" ]; then python scripts/update_data.py --vintages; else python scripts/update_data.py; fi
      - name: Run models and append the forecast archive
        run: python scripts/run_all.py
      - name: Warm-start snapshot for the hosted dashboard (data + computed results)
        run: python scripts/export_snapshot.py
      - name: Evaluate the archive (track record)
        run: python scripts/evaluate_archive.py
      - name: Weekly monitor (Mondays, or manual runs)
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python scripts/weekly_monitor.py; fi
      - name: Monthly view (first Monday of the month, or manual runs)
        run: |
          if { [ "$(date +%d)" -le 7 ] && [ "$(date +%u)" = "1" ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python scripts/monthly_view.py; fi
      - name: LinkedIn figures (also copied to docs/figures for the README)
        run: python scripts/export_figures.py
      - name: README executive summary
        run: python scripts/update_readme.py
      - name: Upload reports and figures
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            out/live
            data/live_smoke.csv
          if-no-files-found: warn
      - name: Commit the forecast archive, README summary and figures
        run: |
          git config user.name "macro-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/forecasts.csv README.md docs/figures snapshot/live
          if ! git diff --cached --quiet; then
            git commit -m "chore(archive): daily forecast archive, README summary, figures and snapshot"
            git pull --rebase origin main
            git push
          fi
