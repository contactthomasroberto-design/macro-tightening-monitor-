name: portfolio-monitor
# Every two hours, every day: score the latest headlines with FinBERT (archive/news_scored.csv) and
# check the paper portfolio's drawdown and day's loss. It checks and alerts; the daily rebalance runs
# in refresh.yml. Every two hours rather than hourly to stay inside the free Actions minutes of a
# private repository (about 360 runs a month of 2-3 minutes).
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: portfolio-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MACRO_MODE: live
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache the FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosusai-v1
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-news.txt
          pip install -e . --no-deps
      - name: Score the news and collect bank and fund publications (issue on an extreme holding score)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/score_news.py --issue
      - name: Check drawdown and daily loss
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/portfolio_monitor.py --issue
      - name: Commit the news archive and alert states
        run: |
          git config user.name "macro-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in archive/news_scored.csv archive/news_alerts.json archive/portfolio_alerts.json archive/research_tracker.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(news): scored headlines and alert state"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
