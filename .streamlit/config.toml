[theme]
# Light is the default; Streamlit's settings menu offers the dark theme (colors in macro.plotting).
base = "light"
primaryColor = "#1f3a5f"
font = "sans serif"
baseRadius = "small"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
