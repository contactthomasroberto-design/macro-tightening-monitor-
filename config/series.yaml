# Series catalogue — single source of truth for the data layer.
#
# Every entry:
#   id               internal id used across the code (FRED mnemonic where one exists)
#   source           fred | ecb | yahoo | nyfed_files | fed_board_files | philly | cftc
#   source_id        identifier at the source (ECB series key, Yahoo ticker, file+column, ...)
#   freq             D | W | M | Q
#   units            as published
#   release_lag_days days between the END of the reference period and first publication
#                    (approximate, conservative). Features at date t use only data with
#                    period_end + lag <= t (BRIEF §2.2).
#   region           US | EA | JP | GLOBAL
#   category         used for news decomposition and the data-health page
#   verify           true = ID, units or freshness not yet confirmed by the live smoke test
#   terms            redistribution / history caveats (BRIEF §2.12)
#
# IDs marked verify: true MUST be checked with `make test-live` before any live publication.

defaults:
  fred_terms: &fred "FRED; public domain unless noted by the original source"
  ice_terms: &ice "ICE BofA via FRED: copyrighted, FRED may truncate history; do not redistribute raw data"
  yahoo_terms: &yahoo "Yahoo Finance via public endpoint: personal, non-commercial use only; do not redistribute"
  ecb_terms: &ecb "ECB Data Portal: reuse allowed with source attribution"

