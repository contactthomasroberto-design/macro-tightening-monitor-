# Price-anomaly check (fund_checks.price_jumps / source_mismatches; scripts/portfolio_monitor.py).
# A daily move beyond `jump_sd` trailing-year standard deviations is an anomaly unless the sector
# proxy moved by more than `proxy_sd` of its own the same day; a Yahoo/Stooq gap beyond `source_tol`
# on the same date is an anomaly. Stooq covers the US listings only (sources.stooq_symbol); Korean names are skipped.
anomalies:
  jump_sd: 6.0
  proxy_sd: 3.0
  source_tol: 0.02
  proxy:
    VGK: EFA
    EWJ: EFA
    MCHI: EEM
    INDA: EEM
    EWT: EEM
    EWY: EEM
    EWZ: EEM
