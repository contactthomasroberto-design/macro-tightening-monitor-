# Published views of banks and asset managers, dated and sourced. Stance per instrument of the
# portfolio universe: +1 overweight / favoured, +0.5 mildly positive, 0 neutral, -0.5, -1 underweight.
# A view counts from its publication date for six months (portfolio.house_scores), with confidence
# `house` in config/portfolio.yaml. Collected 2026-11-17 from the sources linked (secondary coverage
# where the original report is not public); the nightly research run adds new ones.
# Only what the source states is encoded; nothing is inferred from tone.
views:
