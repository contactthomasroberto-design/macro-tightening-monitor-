    summary: >-
      Positive equity and bond returns with more volatility; overweight US and Japanese equities,
      neutral Asia ex-Japan and EM, underweight Europe; credit spreads to widen, US high yield to
      underperform; commodities flat; gold as a hedge; S&P 500 8,700; Brent $78 end-2027.
    stances: {SPY: 1, EWJ: 1, VGK: -1, EEM: 0, MCHI: 0, EWT: 0, EWY: 0, HYG: -1, LQD: -0.5, GLD: 0.5, DBC: 0, BNO: -0.5, IEF: 0.5}
